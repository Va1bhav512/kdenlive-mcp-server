[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kdenlive-mcp-server"
version = "0.1.2"
description = "MCP server for Kdenlive video editing via cli-anything-kdenlive"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.28.0,<2",
    "click>=8.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.license]
text = "MIT"

[project.scripts]
kdenlive-mcp = "kdenlive_mcp_server.server:main"

[tool.hatch.build]
exclude = [".backpass", ".kimchi", ".git", ".venv", ".pytest_cache", "uv.lock", ".python-version"]

[tool.hatch.build.targets.wheel]
packages = ["kdenlive_mcp_server"]

[tool.hatch.build.targets.wheel.force-include]
"vendor/cli_anything" = "cli_anything"
